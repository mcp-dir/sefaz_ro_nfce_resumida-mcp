# Smithery configuration for SEFAZ RO: NFC-e Resumida
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_ro_nfce_resumida

name: sefaz_ro_nfce_resumida-mcp
displayName: "SEFAZ RO: NFC-e Resumida"
description: >
  SEFAZ RO: NFC-e Resumida, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_ro_nfce_resumida-mcp
repository: https://github.com/mcp-dir/sefaz_ro_nfce_resumida-mcp

tags:
  - sefaz_ro_nfce_resumida
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_ro_nfce_resumida

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_ro_nfce_resumida/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
